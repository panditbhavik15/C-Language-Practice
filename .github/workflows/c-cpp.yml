name: Build C Programs

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build and test every program
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show compiler version
        run: gcc --version

      - name: Compile all programs
        run: bash compile-all.sh

      - name: Run expected-output tests
        run: bash run-tests.sh

  windows:
    name: Build and test every program (Windows)
    runs-on: windows-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show compiler version
        run: gcc --version

      - name: Compile all programs
        run: .\compile-all.cmd

      - name: Run expected-output tests
        run: .\run-tests.cmd
